packages:
  - apps/*
  - packages/*

# Versi paket dikunci di satu tempat (K-050). package.json cukup menulis "catalog:".
# Aturan memilih versi: rilis stabil terbaru yang sudah berumur >= 7 hari saat dipasang.
catalog:
  # Inti
  typescript: 6.0.3
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.0
  '@vitejs/plugin-react': 6.1.1
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  react-router: 8.4.0
  '@tanstack/react-query': 5.103.2
  react-hook-form: 7.88.0
  '@hookform/resolvers': 5.9.1
  zod: 4.6.5
  hono: 4.13.8
  '@hono/node-server': 2.1.1
  '@hono/zod-validator': 0.9.1
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  vitest: 5.0.1
  '@playwright/test': 1.63.0
  # Server
  pg: 8.23.0
  '@types/pg': 8.23.1
  '@types/node': 24.13.6
  pino: 10.3.1
  pino-pretty: 13.1.3
  argon2: 0.45.1
  date-fns: 4.4.0
  '@date-fns/tz': 1.5.0
  tsx: 4.23.15
  tsdown: 0.23.0
  # Komponen UI (shadcn/ui)
  radix-ui: 1.6.7
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  lucide-react: 1.47.0
  tw-animate-css: 1.4.0
  sonner: 2.0.8
  # Kualitas kode
  eslint: 10.11.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.70.1
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.12.0
  prettier: 3.9.8
  husky: 9.1.7
  lint-staged: 17.5.1

# Paket yang boleh menjalankan skrip saat dipasang (pnpm menolak yang tidak terdaftar).
allowBuilds:
  esbuild: true
  argon2: true
